server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA sem client-side router hoje (uma tela só), mas cai pro index.html
    # em qualquer caminho que não bate com um arquivo real — já cobre se um
    # router entrar no futuro, sem custo nenhum agora.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets do build (Vite já dá hash no nome) — cache longo e imutável.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca em cache — sempre pega o build mais novo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
